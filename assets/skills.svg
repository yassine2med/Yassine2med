<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="What I build">
<defs><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a36"/><stop offset="1" stop-color="#0b1124"/></linearGradient></defs>
<style>.h{font:700 21px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#eef2ff}.d{font:400 14.5px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa6cf}.c{animation:rise .8s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
<g class="c" style="animation-delay:0.0s"><rect x="0" y="8" width="392" height="192" rx="20" fill="url(#card)" stroke="#27335f"/>
<circle cx="40" cy="54" r="9" fill="#22d3ee"/><circle cx="40" cy="54" r="16" fill="none" stroke="#22d3ee" stroke-opacity=".35"/>
<text class="h" x="68" y="61">Agentic automation</text>
<text class="d" x="30" y="108">Claude-powered workflows that run</text>
<text class="d" x="30" y="132">coordination, mail and reporting end to</text>
<text class="d" x="30" y="156">end</text>
</g>
<g class="c" style="animation-delay:0.1s"><rect x="404" y="8" width="392" height="192" rx="20" fill="url(#card)" stroke="#27335f"/>
<circle cx="444" cy="54" r="9" fill="#a78bfa"/><circle cx="444" cy="54" r="16" fill="none" stroke="#a78bfa" stroke-opacity=".35"/>
<text class="h" x="472" y="61">Python and APIs</text>
<text class="d" x="434" y="108">Reporting, data audits and Salesforce CLI</text>
<text class="d" x="434" y="132">scripts (one audit found ~870 duplicates)</text>
</g>
<g class="c" style="animation-delay:0.2s"><rect x="808" y="8" width="392" height="192" rx="20" fill="url(#card)" stroke="#27335f"/>
<circle cx="848" cy="54" r="9" fill="#f472b6"/><circle cx="848" cy="54" r="16" fill="none" stroke="#f472b6" stroke-opacity=".35"/>
<text class="h" x="876" y="61">Salesforce</text>
<text class="d" x="838" y="108">Administration, work-order operations and</text>
<text class="d" x="838" y="132">automation at city scale</text>
</g>
<g class="c" style="animation-delay:0.3s"><rect x="0" y="218" width="392" height="192" rx="20" fill="url(#card)" stroke="#27335f"/>
<circle cx="40" cy="264" r="9" fill="#fbbf24"/><circle cx="40" cy="264" r="16" fill="none" stroke="#fbbf24" stroke-opacity=".35"/>
<text class="h" x="68" y="271">Web and apps</text>
<text class="d" x="30" y="318">Next.js, TypeScript and React sites, from</text>
<text class="d" x="30" y="342">design to deploy</text>
</g>
<g class="c" style="animation-delay:0.4s"><rect x="404" y="218" width="392" height="192" rx="20" fill="url(#card)" stroke="#27335f"/>
<circle cx="444" cy="264" r="9" fill="#34d399"/><circle cx="444" cy="264" r="16" fill="none" stroke="#34d399" stroke-opacity=".35"/>
<text class="h" x="472" y="271">Networks and systems</text>
<text class="d" x="434" y="318">Cisco CCNA-track, UniFi, hands-on</text>
<text class="d" x="434" y="342">troubleshooting</text>
</g>
<g class="c" style="animation-delay:0.5s"><rect x="808" y="218" width="392" height="192" rx="20" fill="url(#card)" stroke="#27335f"/>
<circle cx="848" cy="264" r="9" fill="#fb923c"/><circle cx="848" cy="264" r="16" fill="none" stroke="#fb923c" stroke-opacity=".35"/>
<text class="h" x="876" y="271">AI integrations</text>
<text class="d" x="838" y="318">Approval-gated mail agent, assistants and</text>
<text class="d" x="838" y="342">tools around the Claude API</text>
</g>
</svg>