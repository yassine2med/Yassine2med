<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Yassine Emhamed, IT and Network Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#101a38"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <style>
    .name{font:800 62px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-1px;fill:url(#ink)}
    .role{font:600 20px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:6px;fill:#cbd5f5}
    .tag{font:400 19px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3d0}
    .mono{font:500 14px Consolas,'Courier New',monospace;fill:#22d3ee}
    .node{fill:#22d3ee}
    .link{stroke:#6d7bd6;stroke-width:1.2;opacity:.45}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    .p2{animation-delay:.8s}.p3{animation-delay:1.6s}.p4{animation-delay:2.4s}
    .drift{animation:drift 9s ease-in-out infinite alternate}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes pulse{0%,100%{opacity:.25;r:3}50%{opacity:1;r:6}}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-26px,14px)}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect x="-80" y="-60" width="1360" height="460" fill="url(#glowA)" class="drift"/>
    <rect x="-80" y="-60" width="1360" height="460" fill="url(#glowB)" class="drift" style="animation-direction:alternate-reverse"/>
    <!-- network constellation -->
    <g>
      <line class="link" x1="760" y1="70" x2="880" y2="140"/>
      <line class="link" x1="880" y1="140" x2="1010" y2="90"/>
      <line class="link" x1="880" y1="140" x2="960" y2="240"/>
      <line class="link" x1="1010" y1="90" x2="1120" y2="170"/>
      <line class="link" x1="960" y1="240" x2="1120" y2="170"/>
      <line class="link" x1="960" y1="240" x2="810" y2="270"/>
      <line class="link" x1="760" y1="70" x2="700" y2="190"/>
      <line class="link" x1="700" y1="190" x2="810" y2="270"/>
      <circle class="node pulse" cx="760" cy="70" r="4"/>
      <circle class="node pulse p2" cx="880" cy="140" r="5" fill="#a78bfa"/>
      <circle class="node pulse p3" cx="1010" cy="90" r="4"/>
      <circle class="node pulse p4" cx="1120" cy="170" r="4" fill="#f472b6"/>
      <circle class="node pulse p2" cx="960" cy="240" r="5"/>
      <circle class="node pulse p3" cx="810" cy="270" r="4" fill="#a78bfa"/>
      <circle class="node pulse" cx="700" cy="190" r="4" fill="#f472b6"/>
    </g>
    <text class="mono" x="70" y="80">&gt; hello, world <tspan class="cursor">_</tspan></text>
    <text class="name" x="68" y="160">Yassine Emhamed</text>
    <text class="role" x="70" y="206">IT &#183; NETWORK &#183; AUTOMATION</text>
    <text class="tag" x="70" y="258">I find what is slow or broken, then build the fix.</text>
    <text class="tag" x="70" y="288">English &#183; Fran&#231;ais &#183; &#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</text>
    <rect x="0" y="334" width="1200" height="6" fill="url(#ink)"/>
  </g>
</svg>
